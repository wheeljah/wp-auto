<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}wp-auto{% endblock %} · wp-auto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif; }
        pre { font-family: "JetBrains Mono", Consolas, monospace; font-size: 0.85em; }
        .prose h2 { font-size: 1.25em; font-weight: 600; margin-top: 1em; margin-bottom: 0.5em; }
        .prose p { margin-bottom: 0.5em; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
            <a href="/" class="font-bold text-lg text-slate-900 hover:text-blue-600">
                ⚡ wp-auto
            </a>
            <div class="flex gap-1 text-sm">
                <a href="/" class="px-3 py-1.5 rounded {% if page == 'dashboard' %}bg-slate-100 text-slate-900 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">대시보드</a>
                <a href="/verify" class="px-3 py-1.5 rounded {% if page == 'verify' %}bg-slate-100 text-slate-900 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">점수화</a>
                <a href="/generate" class="px-3 py-1.5 rounded {% if page == 'generate' %}bg-slate-100 text-slate-900 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">AI 생성</a>
                <a href="/publish" class="px-3 py-1.5 rounded {% if page == 'publish' %}bg-slate-100 text-slate-900 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">발행</a>
                <a href="/optimize" class="px-3 py-1.5 rounded {% if page == 'optimize' %}bg-slate-100 text-slate-900 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">이미지</a>
                <a href="/measure" class="px-3 py-1.5 rounded {% if page == 'measure' %}bg-slate-100 text-slate-900 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">CWV</a>
                <a href="/settings" class="px-3 py-1.5 rounded {% if page == 'settings' %}bg-slate-100 text-slate-900 font-medium{% else %}text-slate-600 hover:text-slate-900{% endif %}">설정</a>
            </div>
            <div class="ml-auto text-xs text-slate-500">
                v{{ version }} · {{ wp_mode }}
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
    <footer class="text-center text-xs text-slate-400 py-6">
        wp-auto v{{ version }} · <a href="https://github.com/wheeljah/wp-auto" class="hover:text-slate-600">GitHub</a>
    </footer>
</body>
</html>
