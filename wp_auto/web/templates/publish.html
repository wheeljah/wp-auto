{% extends "base.html" %}
{% block title %}발행{% endblock %}
{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold">WP 발행</h1>
        <p class="text-sm text-slate-600 mt-1">HTML → 점수화 게이트 → Mock/Real WP 발행</p>
    </div>

    <form id="pub-form" class="bg-white border border-slate-200 rounded-lg p-5 space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">HTML *</label>
            <textarea name="html" id="html" rows="10" required
                class="w-full px-3 py-2 border border-slate-300 rounded font-mono text-xs"
                placeholder="&lt;html&gt;...&lt;/html&gt;"></textarea>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">제목 (선택)</label>
                <input type="text" name="title" id="title"
                    class="w-full px-3 py-2 border border-slate-300 rounded text-sm"
                    placeholder="HTML에서 자동 추출">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">포커스 키워드</label>
                <input type="text" name="focus_keyword" id="focus_keyword"
                    class="w-full px-3 py-2 border border-slate-300 rounded text-sm"
                    placeholder="워드프레스 SEO">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">상태</label>
                <select name="status" id="status" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                    <option value="draft">draft (저장만)</option>
                    <option value="publish">publish (즉시 발행)</option>
                </select>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <label class="flex items-center gap-2 text-sm">
                <input type="checkbox" name="force" id="force" class="rounded">
                <span>점수 < 75여도 강제 발행</span>
            </label>
            <button type="submit" id="submit-btn"
                class="px-5 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-slate-400">
                발행 실행
            </button>
        </div>
    </form>

    <div id="result" class="hidden"></div>
</div>

<script>
const form = document.getElementById('pub-form');
const result = document.getElementById('result');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = '발행 중...';
    result.classList.add('hidden');
    result.innerHTML = '';

    const fd = new FormData(form);
    try {
        const r = await fetch('/api/publish', { method: 'POST', body: fd });
        const data = await r.json();
        render(data);
    } catch (err) {
        result.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded">' + err.message + '</div>';
        result.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = '발행 실행';
    }
});

function render(data) {
    if (data.error) {
        let html = '<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded">';
        html += '<div class="font-medium mb-1">' + data.error + '</div>';
        if (data.recommendations) {
            html += '<ul class="list-disc list-inside text-sm">';
            for (const r of data.recommendations) html += '<li>' + r + '</li>';
            html += '</ul>';
        }
        html += '</div>';
        result.innerHTML = html;
        result.classList.remove('hidden');
        return;
    }
    let html = '<div class="bg-green-50 border border-green-200 text-green-800 p-5 rounded-lg">';
    html += '<div class="text-2xl mb-2">✓</div>';
    html += '<div class="font-medium">post_id=' + data.post_id + ' 생성 완료</div>';
    html += '<div class="text-sm text-slate-600 mt-2">';
    html += '<div>제목: ' + data.title + '</div>';
    html += '<div>상태: ' + data.status + '</div>';
    html += '<div>점수: ' + data.score + '/100</div>';
    html += '</div>';
    html += '<a href="/" class="inline-block mt-3 text-sm text-blue-600 underline">→ 대시보드에서 확인</a>';
    html += '</div>';
    result.innerHTML = html;
    result.classList.remove('hidden');
}
</script>
{% endblock %}
