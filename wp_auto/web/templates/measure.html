{% extends "base.html" %}
{% block title %}CWV 측정{% endblock %}
{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold">Core Web Vitals 측정</h1>
        <p class="text-sm text-slate-600 mt-1">Playwright + web-vitals (3회 반복 중앙값)</p>
    </div>

    <form id="measure-form" class="bg-white border border-slate-200 rounded-lg p-5 space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">URL *</label>
            <input type="url" name="url" id="url" required
                class="w-full px-3 py-2 border border-slate-300 rounded text-sm"
                placeholder="https://example.com/post">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">반복 횟수</label>
            <input type="number" name="runs" id="runs" value="3" min="1" max="5"
                class="w-full px-3 py-2 border border-slate-300 rounded text-sm w-32">
        </div>
        <button type="submit" id="submit-btn"
            class="px-5 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-slate-400">
            CWV 측정 (1~3분 소요)
        </button>
    </form>

    <div id="result" class="hidden"></div>
</div>

<script>
const form = document.getElementById('measure-form');
const result = document.getElementById('result');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.innerHTML = '<span class="inline-block animate-spin">⏳</span> 측정 중...';
    result.classList.add('hidden');

    const fd = new FormData(form);
    try {
        const r = await fetch('/api/measure', { method: 'POST', body: fd });
        const data = await r.json();
        render(data);
    } catch (err) {
        result.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded">' + err.message + '</div>';
        result.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = 'CWV 측정 (1~3분 소요)';
    }
});

function render(data) {
    if (data.error) {
        result.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded">' + data.error + '</div>';
        result.classList.remove('hidden');
        return;
    }
    const color = (v) => v <= 2.5 ? 'green' : (v <= 4 ? 'yellow' : 'red');
    let html = '<div class="bg-white border border-slate-200 rounded-lg p-5">';
    html += '<h2 class="font-medium mb-3">' + data.url + '</h2>';
    html += '<div class="grid grid-cols-3 gap-4 mb-4">';
    html += '<div class="text-center p-3 bg-slate-50 rounded"><div class="text-xs text-slate-500">LCP</div><div class="text-2xl font-bold">' + (data.lcp_ms / 1000).toFixed(2) + 's</div></div>';
    html += '<div class="text-center p-3 bg-slate-50 rounded"><div class="text-xs text-slate-500">INP</div><div class="text-2xl font-bold">' + data.inp_ms + 'ms</div></div>';
    html += '<div class="text-center p-3 bg-slate-50 rounded"><div class="text-xs text-slate-500">CLS</div><div class="text-2xl font-bold">' + data.cls + '</div></div>';
    html += '</div>';
    html += '<div class="text-sm mb-3">종합 판정: <span class="font-mono px-2 py-0.5 rounded bg-slate-100">' + data.rating + '</span></div>';
    if (data.recommendations && data.recommendations.length) {
        html += '<ul class="list-disc list-inside text-sm space-y-1">';
        for (const r of data.recommendations) html += '<li>' + r + '</li>';
        html += '</ul>';
    }
    html += '</div>';
    result.innerHTML = html;
    result.classList.remove('hidden');
}
</script>
{% endblock %}
