{% extends "base.html" %}
{% block title %}이미지 최적화{% endblock %}
{% block content %}
<div class="space-y-6">
    <div>
        <h1 class="text-2xl font-bold">이미지 최적화</h1>
        <p class="text-sm text-slate-600 mt-1">Pillow WebP/AVIF 변환 + 리사이즈</p>
    </div>

    <form id="opt-form" class="bg-white border border-slate-200 rounded-lg p-5 space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">이미지 파일 *</label>
            <input type="file" name="file" id="file" accept="image/*" required
                class="w-full text-sm">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">최대 가로 크기 (px)</label>
                <input type="number" name="max_width" id="max_width" value="1200" min="200" max="4000" step="100"
                    class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">형식</label>
                <select name="format" id="format" class="w-full px-3 py-2 border border-slate-300 rounded text-sm">
                    <option value="webp">WebP (호환성 좋음)</option>
                    <option value="avif">AVIF (압축률 최고)</option>
                </select>
            </div>
        </div>
        <button type="submit" id="submit-btn"
            class="px-5 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:bg-slate-400">
            최적화 실행
        </button>
    </form>

    <div id="result" class="hidden"></div>
</div>

<script>
const form = document.getElementById('opt-form');
const result = document.getElementById('result');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = '변환 중...';
    result.classList.add('hidden');
    result.innerHTML = '';

    const fd = new FormData(form);
    try {
        const r = await fetch('/api/optimize', { method: 'POST', body: fd });
        const data = await r.json();
        render(data);
    } catch (err) {
        result.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded">' + err.message + '</div>';
        result.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.textContent = '최적화 실행';
    }
});

function render(data) {
    if (data.error) {
        result.innerHTML = '<div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded">' + data.error + '</div>';
        result.classList.remove('hidden');
        return;
    }
    let html = '<div class="bg-white border border-slate-200 rounded-lg p-5">';
    html += '<h2 class="font-medium mb-3">최적화 완료</h2>';
    html += '<div class="grid grid-cols-2 gap-4 text-sm">';
    html += '<div>원본: <span class="font-mono">' + data.src_size_kb + ' KB</span></div>';
    html += '<div>결과: <span class="font-mono">' + data.dst_size_kb + ' KB</span></div>';
    html += '<div>감소: <span class="font-mono text-green-600 font-bold">' + data.reduction_pct + '%</span></div>';
    html += '<div>크기: <span class="font-mono">' + data.width + 'x' + data.height + ' ' + data.format + '</span></div>';
    html += '</div>';
    html += '<p class="text-xs text-slate-500 mt-3">저장 위치: ' + data.dst_path + '</p>';
    html += '</div>';
    result.innerHTML = html;
    result.classList.remove('hidden');
}
</script>
{% endblock %}
