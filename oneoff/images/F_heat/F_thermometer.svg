<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="39도 폭염을 나타내는 온도계 일러스트">
  <title>한국 39도 폭염 시뮬레이션 (2026년 8월)</title>
  <desc>한여름 한낮 39도 폭염을 나타내는 빨간색 수은주와 도시 실루엣. 자체 제작 (CC0).</desc>

  <!-- 배경 그라데이션 (맑은 여름 하늘) -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="mercury" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 배경 -->
  <rect width="400" height="500" fill="url(#sky)"/>

  <!-- 태양 -->
  <circle cx="320" cy="80" r="60" fill="url(#sun)"/>
  <circle cx="320" cy="80" r="28" fill="#fbbf24"/>
  <!-- 태양 광선 -->
  <g stroke="#fbbf24" stroke-width="3" stroke-linecap="round">
    <line x1="320" y1="20" x2="320" y2="35"/>
    <line x1="320" y1="125" x2="320" y2="140"/>
    <line x1="260" y1="80" x2="275" y2="80"/>
    <line x1="365" y1="80" x2="380" y2="80"/>
    <line x1="275" y1="35" x2="285" y2="45"/>
    <line x1="365" y1="125" x2="355" y2="115"/>
    <line x1="275" y1="125" x2="285" y2="115"/>
    <line x1="365" y1="35" x2="355" y2="45"/>
  </g>

  <!-- 도시 실루엣 (배경) -->
  <g fill="#9ca3af" opacity="0.6">
    <rect x="0" y="400" width="60" height="100"/>
    <rect x="50" y="370" width="40" height="130"/>
    <rect x="90" y="380" width="50" height="120"/>
    <rect x="140" y="350" width="60" height="150"/>
    <rect x="200" y="380" width="50" height="120"/>
    <rect x="250" y="360" width="60" height="140"/>
    <rect x="310" y="390" width="40" height="110"/>
    <rect x="350" y="400" width="50" height="100"/>
  </g>

  <!-- 온도계 본체 (수직) -->
  <g transform="translate(80, 80)">
    <!-- 외관 -->
    <rect x="40" y="0" width="20" height="280" fill="#f3f4f6" stroke="#374151" stroke-width="2" rx="10"/>
    <!-- 수은주 (39도까지 채워짐) -->
    <rect x="46" y="35" width="8" height="245" fill="url(#mercury)"/>
    <!-- 눈금 (0도 ~ 50도) -->
    <g stroke="#374151" stroke-width="1.5">
      <line x1="20" y1="0" x2="35" y2="0"/>
      <line x1="20" y1="56" x2="35" y2="56"/>
      <line x1="20" y1="112" x2="35" y2="112"/>
      <line x1="20" y1="168" x2="35" y2="168"/>
      <line x1="20" y1="224" x2="35" y2="224"/>
      <line x1="20" y1="280" x2="35" y2="280"/>
    </g>
    <!-- 눈금 라벨 -->
    <g font-family="sans-serif" font-size="13" fill="#1f2937" text-anchor="end" font-weight="600">
      <text x="18" y="5">50℃</text>
      <text x="18" y="61">40℃</text>
      <text x="18" y="117">30℃</text>
      <text x="18" y="173">20℃</text>
      <text x="18" y="229">10℃</text>
      <text x="18" y="285">0℃</text>
    </g>
    <!-- 39도 표시 (강조) -->
    <line x1="14" y1="62" x2="35" y2="62" stroke="#dc2626" stroke-width="3"/>
    <text x="55" y="60" font-family="sans-serif" font-size="16" fill="#dc2626" font-weight="700">39℃ 폭염</text>

    <!-- 수은주 아래 둥근 부분 -->
    <circle cx="50" cy="295" r="22" fill="url(#mercury)" stroke="#374151" stroke-width="2"/>
    <circle cx="50" cy="295" r="18" fill="#dc2626"/>
  </g>

  <!-- 화상 표시 (한글 텍스트) -->
  <text x="200" y="450" font-family="sans-serif" font-size="22" fill="#1f2937" text-anchor="middle" font-weight="700">
    2026년 8월 한국 39도 폭염
  </text>
  <text x="200" y="478" font-family="sans-serif" font-size="14" fill="#4b5563" text-anchor="middle">
    광주·대구·부산 39℃ · 서울 37℃ (한겨레 보도 기반)
  </text>
</svg>
