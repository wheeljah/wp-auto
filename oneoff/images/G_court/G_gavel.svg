<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400" role="img" aria-label="법정을 나타내는 법槌 일러스트">
  <title>보완수사권 폐지 — 법의 관점</title>
  <desc>법정을 상징하는 법槌(gavel)과 책상, 그리고 그 뒤의 정의의 여신상 실루엣. 자체 제작 (CC0).</desc>

  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a16207"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="gavel-head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f4f6"/>
      <stop offset="100%" stop-color="#d1d5db"/>
    </linearGradient>
  </defs>

  <!-- 배경 (법정 벽) -->
  <rect width="500" height="400" fill="url(#wall)"/>

  <!-- 벽 장식 (수직 패널) -->
  <g fill="#9ca3af" opacity="0.3">
    <rect x="0" y="0" width="500" height="20"/>
    <rect x="0" y="380" width="500" height="20"/>
  </g>

  <!-- 정의의 여신상 실루엣 (배경 중앙) -->
  <g transform="translate(250, 110)" opacity="0.18">
    <!-- 머리 -->
    <circle cx="0" cy="0" r="14" fill="#374151"/>
    <!-- 눈 가림 -->
    <rect x="-12" y="-4" width="24" height="3" fill="#374151"/>
    <!-- 몸통 (드레스) -->
    <path d="M -22 12 L -32 90 L 32 90 L 22 12 Z" fill="#374151"/>
    <!-- 저울 -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#374151" stroke-width="1.5"/>
    <circle cx="-22" cy="-5" r="6" fill="none" stroke="#374151" stroke-width="1.5"/>
    <circle cx="22" cy="-5" r="6" fill="none" stroke="#374151" stroke-width="1.5"/>
  </g>

  <!-- 책상 (앞쪽) -->
  <rect x="50" y="280" width="400" height="20" fill="url(#wood)" rx="3"/>
  <rect x="50" y="300" width="400" height="100" fill="#451a03" opacity="0.85"/>

  <!-- 법槌 받침 (sounding block) -->
  <ellipse cx="250" cy="280" rx="50" ry="8" fill="url(#gavel-head)"/>
  <rect x="210" y="260" width="80" height="22" fill="url(#gavel-head)" rx="3"/>

  <!-- 법槌 (gavel) — 들려있는 자세 -->
  <g transform="translate(250, 200) rotate(-20)">
    <!-- 손잡이 (handle) -->
    <rect x="-60" y="-7" width="120" height="14" fill="url(#gavel-head)" rx="6"/>
    <!-- 머리 (mallet head) -->
    <ellipse cx="55" cy="0" rx="28" ry="22" fill="url(#gavel-head)"/>
    <ellipse cx="55" cy="-2" rx="24" ry="18" fill="#92400e" opacity="0.5"/>
    <!-- 머리 하이라이트 -->
    <ellipse cx="50" cy="-8" rx="8" ry="3" fill="#fbbf24" opacity="0.3"/>
  </g>

  <!-- 손잡이 그립 디테일 -->
  <g transform="translate(195, 200) rotate(-20)">
    <line x1="0" y1="-6" x2="0" y2="6" stroke="#451a03" stroke-width="1"/>
    <line x1="-10" y1="-6" x2="-10" y2="6" stroke="#451a03" stroke-width="1"/>
    <line x1="-20" y1="-6" x2="-20" y2="6" stroke="#451a03" stroke-width="1"/>
  </g>

  <!-- 책상 위 자료 (왼쪽) -->
  <g transform="translate(110, 260)">
    <rect x="0" y="0" width="60" height="20" fill="#fef3c7" stroke="#78350f" stroke-width="1"/>
    <line x1="5" y1="6" x2="55" y2="6" stroke="#78350f" stroke-width="0.5"/>
    <line x1="5" y1="11" x2="55" y2="11" stroke="#78350f" stroke-width="0.5"/>
    <line x1="5" y1="16" x2="40" y2="16" stroke="#78350f" stroke-width="0.5"/>
  </g>

  <!-- 책상 위 자료 (오른쪽) -->
  <g transform="translate(340, 255)">
    <rect x="0" y="0" width="70" height="25" fill="#dbeafe" stroke="#1e3a8a" stroke-width="1"/>
    <line x1="5" y1="6" x2="65" y2="6" stroke="#1e3a8a" stroke-width="0.5"/>
    <line x1="5" y1="12" x2="65" y2="12" stroke="#1e3a8a" stroke-width="0.5"/>
    <line x1="5" y1="18" x2="50" y2="18" stroke="#1e3a8a" stroke-width="0.5"/>
  </g>

  <!-- 제목 텍스트 -->
  <text x="250" y="345" font-family="sans-serif" font-size="20" fill="#fef3c7" text-anchor="middle" font-weight="700">
    보완수사권 폐지 — 법의 관점
  </text>
  <text x="250" y="370" font-family="sans-serif" font-size="13" fill="#fbbf24" text-anchor="middle" opacity="0.85">
    형사소송법 개정안 / 2026년 8월 (헤드라인제주 보도 기반)
  </text>
</svg>
