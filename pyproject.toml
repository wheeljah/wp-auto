[project]
name = "wp-auto"
version = "0.1.0"
description = "Free WordPress blog automation toolkit (tool-first build)"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "loguru>=0.7.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
# W2+ 에서 추가
# ollama = ["ollama>=0.2.0"]
# http = ["httpx>=0.27.0"]
# image = ["pillow>=10.3.0"]
# cwv = ["playwright>=1.43.0"]

[project.scripts]
wp-auto = "wp_auto.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wp_auto"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
