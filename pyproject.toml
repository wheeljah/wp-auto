[project]
name = "wp-auto"
version = "0.1.0"
description = "Free WordPress blog automation toolkit (tool-first build)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "wheeljah", email = "wheeljah@gmail.com" },
]
requires-python = ">=3.11"
keywords = ["wordpress", "seo", "automation", "blog", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "click>=8.1.7",
    "loguru>=0.7.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
]

[project.urls]
Homepage = "https://github.com/wheeljah/wp-auto"
Repository = "https://github.com/wheeljah/wp-auto"
Issues = "https://github.com/wheeljah/wp-auto/issues"
Changelog = "https://github.com/wheeljah/wp-auto/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]
# W2+ 에서 추가
# ollama = ["ollama>=0.2.0"]
# http = ["httpx>=0.27.0"]
# image = ["pillow>=10.3.0"]
# cwv = ["playwright>=1.43.0"]

[project.scripts]
wp-auto = "wp_auto.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wp_auto"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["wp_auto", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
